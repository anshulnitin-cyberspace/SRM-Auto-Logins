<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SRM Auto Login Ultra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playwrite+DE+SAS&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      padding: 16px;
      font-family: "Playwrite DE SAS", "Segoe Script", "Comic Sans MS", cursive, system-ui, sans-serif;
      background: #f1f3f5;
      color: #1f2328;
    }
    h1 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 14px;
      letter-spacing: -0.01em;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      margin: 10px 0 4px;
      color: inherit;
    }
    .field-row { position: relative; }
    input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
      color: inherit;
      background: #ffffff;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    input:focus {
      border-color: #0969da;
      box-shadow: 0 0 0 2px rgba(9, 105, 218, 0.25);
    }
    .pw-wrap { position: relative; }
    #pwInput { padding-right: 46px; }
    #togglePw {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      padding: 4px 6px;
      font-size: 11px;
      border: none;
      background: transparent;
      color: #57606a;
      cursor: pointer;
      font-family: inherit;
    }
    #togglePw:hover { color: #0969da; }
    #saveBtn {
      width: 100%;
      margin-top: 14px;
      padding: 9px 0;
      border: none;
      border-radius: 6px;
      background: linear-gradient(135deg, #6cc8f2 0%, #63e0b4 100%);
      color: #ffffff;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: filter 0.15s ease, box-shadow 0.15s ease;
    }
    #saveBtn:hover {
      filter: brightness(0.96);
      box-shadow: 0 1px 4px rgba(31, 108, 120, 0.25);
    }
    #status {
      min-height: 16px;
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    #status.ok { color: #1a7f37; }
    #status.err { color: #d1242f; }
    #accountsSection { margin-top: 16px; border-top: 1px solid #d8dee4; padding-top: 4px; }
    #accountsToggle {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border: none;
      background: transparent;
      color: #57606a;
      font: inherit;
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      cursor: pointer;
    }
    #accountsToggle:hover { color: #1f2328; }
    .chevron {
      display: inline-block;
      font-size: 10px;
      transition: transform 0.2s ease;
    }
    #accountsToggle[aria-expanded="true"] .chevron { transform: rotate(180deg); }
    #accountList { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    #accountList[hidden] { display: none; }
    .acc-row {
      padding: 8px 10px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .acc-email {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .acc-meta { font-size: 11px; color: #656d76; }
    .acc-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .acc-btn {
      font-size: 11px;
      padding: 3px 8px;
      border: 1px solid #d0d7de;
      border-radius: 4px;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font-family: inherit;
      transition: border-color 0.15s ease, color 0.15s ease;
    }
    .acc-btn:hover { border-color: #0969da; color: #0969da; }
    .acc-btn.danger:hover { border-color: #d1242f; color: #d1242f; }
    .note {
      margin-top: 12px;
      font-size: 11px;
      line-height: 1.4;
      color: #656d76;
    }
  </style>
</head>
<body>
  <h1>SRM Auto Login Ultra</h1>

  <form id="credForm" novalidate>
    <label for="srmId">NetID</label>
    <input id="srmId" type="text" placeholder="e.g. ab1234" maxlength="20"
           autocomplete="username" spellcheck="false" autocapitalize="off">

    <label for="pwInput">Password</label>
    <div class="pw-wrap">
      <input id="pwInput" type="password" placeholder="Password" autocomplete="current-password">
      <button id="togglePw" type="button">Show</button>
    </div>

    <button id="saveBtn" type="button">Save account</button>
  </form>

  <div id="status" role="status" aria-live="polite"></div>

  <section id="accountsSection" hidden>
    <button id="accountsToggle" type="button" aria-expanded="false">
      <span>Saved accounts</span>
      <span class="chevron">▾</span>
    </button>
    <div id="accountList" hidden></div>
  </section>

  <p class="note">Credentials never leave this device. The extension only runs on accounts.google.com.</p>

  <script src="shared/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
